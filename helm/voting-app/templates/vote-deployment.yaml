{{- if .Values.vote.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: {{ include "voting-app.image" (dict "registry" .Values.imageRegistry "repository" .Values.vote.image.repository "tag" .Values.vote.image.tag) }}
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.vote.service.targetPort }}
              name: vote
          env:
            - name: REDIS_HOST
              value: redis
            {{- range $k, $v := .Values.vote.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
{{- end }}
