{{- if .Values.db.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.db.service.type }}
  ports:
    - name: db-service
      port: {{ .Values.db.service.port }}
      targetPort: {{ .Values.db.service.port }}
  selector:
    app: db
{{- end }}
