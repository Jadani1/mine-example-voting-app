# =============================================================================
# CI/CD Pipeline — GitHub Actions (capstone Step 4)
# =============================================================================
# Each push to main/master:
#   1. Run tests
#   2. Build container images
#   3. Trivy vulnerability scan
#   4. Push images to Docker Hub tagged with the commit SHA
#
# GitHub repo secrets required (same names as the other workflows):
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (not your login password)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Capstone: tag every image with the git commit SHA
  SHA_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests
  # ---------------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test vote service
        working-directory: ./vote
        run: |
          python -m py_compile app.py
          pip install -r requirements.txt
          python -c "import app; print('vote tests OK')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Test result service
        working-directory: ./result
        run: |
          npm ci
          node --check server.js
          echo "result tests OK"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Test worker service
        working-directory: ./worker
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          echo "worker tests OK"

  # ---------------------------------------------------------------------------
  # 2–4. Build → Trivy scan → Push (SHA-tagged) for vote, result, worker
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vote
            context: ./vote
          - name: result
            context: ./result
          - name: worker
            context: ./worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build (load into local Docker for Trivy) ---
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.name }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Trivy vulnerability scan ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ matrix.name }}:${{ env.SHA_TAG }}"
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # --- Push tagged with commit SHA ---
      - name: Push image (commit SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ env.SHA_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
