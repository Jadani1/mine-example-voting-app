# =============================================================================
# Example Voting App — Docker Compose orchestration (Step 3)
# Compose Spec (v2+ CLI). Run: docker compose up --build
# Optional seed data: docker compose --profile seed up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Frontend: voting UI (Python / Flask)
  # ---------------------------------------------------------------------------
  vote:
    build:
      context: ./vote
      target: dev
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Service discovery via Docker DNS on the back-tier network
      REDIS_HOST: redis
      # Vote button labels (read by app.py)
      OPTION_A: Cats
      OPTION_B: Dogs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Live reload for local development
      - ./vote:/usr/local/app
    ports:
      - "8080:80"
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend: live results dashboard (Node.js)
  # ---------------------------------------------------------------------------
  result:
    build: ./result
    # nodemon for local file watching / inspect (overrides image ENTRYPOINT/CMD)
    entrypoint: ["nodemon", "--inspect=0.0.0.0", "server.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Non-root image user binds 8080; host still uses http://localhost:8081
      PORT: "8080"
      NODE_PATH: /node_modules
      # Hostname matches the db service name on the Docker network
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./result:/usr/local/app
    ports:
      - "8081:8080"
      - "127.0.0.1:9229:9229"
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend: vote processor (.NET) — Redis queue → PostgreSQL
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - back-tier
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Data store: Redis (vote queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    # Persist queue data across container restarts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
      - ./healthchecks:/healthchecks
    healthcheck:
      test: /healthchecks/redis.sh
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - back-tier
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Data store: PostgreSQL (tallied votes)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      # Named volume: tallies survive container recreate
      - db-data:/var/lib/postgresql/data
      - ./healthchecks:/healthchecks
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - back-tier
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional one-shot seeder (profile: seed)
  # docker compose --profile seed up -d
  # ---------------------------------------------------------------------------
  seed:
    build: ./seed-data
    profiles: ["seed"]
    depends_on:
      vote:
        condition: service_healthy
    networks:
      - front-tier
    restart: "no"

# =============================================================================
# Named volumes — durable storage for stateful services
# =============================================================================
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# User-defined bridge networks
# front-tier: browser-facing services (vote, result)
# back-tier:  internal service-to-service + data plane
# =============================================================================
networks:
  front-tier:
    driver: bridge
  back-tier:
    driver: bridge
